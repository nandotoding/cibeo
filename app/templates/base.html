<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cibeo - Personal Finance{% endblock %}</title>

    <meta name="description" content="Cibeo - Personal Finance Management.">

    <script>
        (() => {
            try {
                const savedTheme = localStorage.getItem("cibeo-theme");

                document.documentElement.dataset.theme =
                    savedTheme === "light" ? "light" : "dark";
            } catch (error) {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link
        rel="icon"
        type="image/svg+xml"
        href="{{ url_for('static', path='/favicon.svg') }}"
    >
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">

    {% block head %}{% endblock %}
</head>

<body>

    <div class="app-container">

        {% block body %}
        {% endblock %}

    </div>

    <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="Switch to Light Mode"
        title="Switch to Light Mode"
    >
        <span data-theme-icon>☀</span>
        <span data-theme-label>Light Mode</span>
    </button>

    <script src="{{ url_for('static', path='/js/app.js') }}"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
